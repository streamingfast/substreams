version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/tests_e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all:
        patterns: ["*"]
  # Test/bench fixture crates — suppress version and security update PRs.
  - package-ecosystem: "cargo"
    directories:
      - "/sink/sql/db_proto/test/substreams/full-block"
      - "/sink/sql/db_proto/test/substreams/order"
      - "/tests_e2e/dummy"
      - "/tests_e2e/partial_blocks_store"
      - "/wasm/bench/substreams_wasm"
      - "/wasm/bench/allocator_bench"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
