name: Build and Test

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ${{ matrix.os }}
    if: "!startsWith(github.event.head_commit.message, 'GitBook: [#')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod" # Extracts version from the 'go' or 'toolchain' directive

      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Validate GitBook
        run: go run ./docs/.gitbook/validate.go

      - name: Run Tests
        run: ./bin/test.sh

      - name: Build
        run: go build ./...
