name: Build docker image

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "develop"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'GitBook: [#') }}"
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 2 commits so a PR merge commit can be diffed against its base (first parent)
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release and moving tags, promoted by the image-scan gate only once the image is clean.
      # Also the source of the labels/annotations put on the built image.
      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,enable=${{ github.ref == 'refs/heads/develop' }},value=develop
            type=edge,branch=develop
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      # The immutable commit tag, the only one pushed by the build and the one scanned by the gate
      - name: Generate docker commit tag
        id: sha-tag
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      - name: Extract version
        id: extract-version
        run: |
          version=edge
          commit_date="$(git show -s --format=%cI)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          fi

          echo "VERSION=$version (Commit ${GITHUB_SHA::7}, Commit Date $commit_date)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.sha-tag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.extract-version.outputs.VERSION }}

      # The image is always built, only the scan is skipped on pull requests that cannot change its contents.
      # Branch/tag pushes always scan (the release gate stays strict) and the release tags (vX.Y.Z, develop, edge,
      # latest) only exist once the scan is clean, the build pushes the commit tag alone.
      - name: Scan the image
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: streamingfast/actions/image-scan/gate@v1
        with:
          # Single multi-arch image tagged with the short SHA, no per-architecture suffix, exactly the tag pushed by the build
          image: ${{ steps.sha-tag.outputs.tags }}
          promote-tags: ${{ steps.meta.outputs.tags }}
          dockerhub-user: ${{ secrets.DOCKER_SCOUT_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_PASSWORD }}
          github-token: ${{ secrets.PR_COMMENTER }}
          severities: critical,high
          # Paths that affect the image contents, keep in sync with the Dockerfile inputs (the Rust tree is excluded by .dockerignore and never built in the image)
          scan-paths: |
            ^Dockerfile
            ^go\.mod
            ^go\.sum
            ^\.dockerignore
