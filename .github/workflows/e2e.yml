name: End-to-end Tests

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  e2e:
    name: tests_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, 'GitBook: [#')"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            tests_e2e/go.sum

      - name: Run tests_e2e
        working-directory: tests_e2e
        run: go test -v -count=1 -timeout 25m ./...
