syntax = "proto3";

package sf.substreams.internal.v2;

import "google/protobuf/any.proto";
import "sf/substreams/v1/clock.proto";
import "sf/substreams/v1/modules.proto";

option go_package = "github.com/streamingfast/substreams/pb/sf/substreams/intern/v2;pbssinternal";

service Substreams {
  rpc ProcessRange(ProcessRangeRequest) returns (stream ProcessRangeResponse);
}

// Possible types of WASM modules
enum WASMModuleType {
  WASM_MODULE_TYPE_UNSPECIFIED = 0;
  WASM_MODULE_TYPE_RPC_CALL = 1;
}

message ProcessRangeRequest {
  reserved 1;
  uint64 stop_block_num = 2 [deprecated = true];

  string output_module = 3;
  sf.substreams.v1.Modules modules = 4;
  uint32 stage = 5; // 0-based index of stage to execute up to

  string metering_config = 6;
  uint64 first_streamable_block = 7; // first block that can be streamed on that chain
  reserved 8;

  map<string, string> wasm_extension_configs = 9; // TODO: rename to `wasm_extension_configs`

  string merged_blocks_store = 10; // store to use for merged blocks
  string state_store = 11; // store to use for substreams state
  string state_store_default_tag = 12; // default tag to use for state store
  uint64 segment_size = 13; // number of blocks to process in a single batch

  string block_type = 14; // block type to process
  uint64 segment_number = 15; // segment_number * segment_size = start_block_num

  // Whether the tier1 initial request was in production mode or in development mode.
  // It's possible to have tier2 requests in development mode, for example if the Substreams
  // needs to back process stores while in development mode.
  bool production_mode = 16;

  bool stream_output = 17;

  map<string, string> foundational_store_endpoints = 18;

  int64 eth_call_fallback_to_latest_duration = 19; // if non-zero, above this duration in nanoseconds, the eth_calls will use "latest" instead of block ref. It will also automatically retry 'block not found' with 'latest'. It has precedence over eth_call_fallback_to_number_duration.
  int64 eth_call_fallback_to_number_duration = 20; // if non-zero, above this duration in nanoseconds, the eth_calls will use block number instead of block hash

  uint64 store_size_limit = 21; // if non-zero, overrides the default store size limit (in bytes) for stores loaded during this request

  uint64 merged_blocks_bundle_size = 22; // number of blocks per merged-blocks file in merged_blocks_store (0 means the default of 100)
}

message ProcessRangeResponse {
  reserved 1; // previously string module_name = 1;

  reserved 2; // previously in oneof(type): BlockRange processed_range
  reserved 3; // previously in oneof(type): ProcessedBytes processed_bytes

  oneof type {
    Failed failed = 4;
    Completed completed = 5;
    Update update = 6;
    BlockScopedData block_scoped_data = 7;
  }
}

message BlockScopedData {
  google.protobuf.Any output = 1;
  sf.substreams.v1.Clock clock = 2;
}

message Update {
  uint64 duration_ms = 1;
  uint64 progress_blocks = 2;
  uint64 total_bytes_read = 3;
  uint64 total_bytes_written = 4;

  repeated ModuleStats modules_stats = 5;
}

message ModuleStats {
  string name = 1;
  uint64 processing_time_ms = 2;
  uint64 store_operation_time_ms = 3;
  uint64 store_read_count = 4;

  repeated ExternalCallMetric external_call_metrics = 5;

  // store-specific (will be 0 on mappers)
  uint64 store_write_count = 10;
  uint64 store_deleteprefix_count = 11;
  uint64 store_size_bytes = 12;
}

message ExternalCallMetric {
  string name = 1;
  // count is every call that was started, including those still waiting for an answer.
  uint64 count = 2;
  // time_ms includes the time already spent by calls that have not returned yet, so a call
  // hung against an unreachable endpoint shows up as time spent rather than as nothing at all.
  uint64 time_ms = 3;

  // failed_count is how many of those calls came back with an error. A tier2 keeps retrying
  // them internally, so without this tier1 only learns of a failing endpoint once the whole
  // segment gives up, minutes later.
  uint64 failed_count = 4;
  // in_flight_count is how many calls are still waiting for an answer right now.
  uint64 in_flight_count = 5;
  // oldest_in_flight_ms is how long the oldest of them has been waiting.
  uint64 oldest_in_flight_ms = 6;
  // oldest_in_flight_block is the block that call was made on, which is where processing is
  // stuck for as long as it does not return.
  uint64 oldest_in_flight_block = 7;
}

message Completed {
  repeated BlockRange all_processed_ranges = 1;

  reserved 2; // previously trace_id

  // actual processed blocks (excluding blocks skipped by indexes)
  uint64 processed_blocks = 3;
  bool streaming_mode = 4; // confirms that streaming mode was used (compatibility check)
}

message Failed {
  string reason = 1;
  repeated string logs = 2;
  // FailureLogsTruncated is a flag that tells you if you received all the logs or if they
  // were truncated because you logged too much (fixed limit currently is set to 128 KiB).
  bool logs_truncated = 3;
}

message BlockRange {
  uint64 start_block = 2;
  uint64 end_block = 3;
}
