syntax = "proto3";

package sf.substreams.rpc.v3;

import "google/protobuf/any.proto";
import "sf/firehose/v2/firehose.proto";
import "sf/substreams/rpc/v2/service.proto";
import "sf/substreams/v1/clock.proto";
import "sf/substreams/v1/modules.proto";
import "sf/substreams/v1/package.proto";

option go_package = "github.com/streamingfast/substreams/pb/sf/substreams/rpc/v3;pbsubstreamsrpcv3";

// Stream is the primary service for consuming Substreams data using the v3 API.
// It extends the v2 API by accepting a full `.spkg` package instead of raw module
// definitions, and adds support for parameter overrides and network selection applied
// server-side. Responses are identical to those of the v2 API.
service Stream {
  // Blocks streams processed blockchain data for the requested range, applying the
  // Substreams modules defined in the provided `.spkg` package. Parameter overrides
  // (`params`) and network selection (`network`) are resolved server-side.
  // Responses are identical to `sf.substreams.rpc.v2.Stream/Blocks`.
  //
  // For reliable, exactly-once consumption, see `sf.substreams.rpc.v2.BlockScopedData.cursor`
  // and `sf.substreams.rpc.v2.BlockUndoSignal.last_valid_cursor`: persisting and resuming
  // from these cursors is the foundation of the "never miss a beat" guarantee.
  rpc Blocks(Request) returns (stream sf.substreams.rpc.v2.Response);
}

// Request is the input message for the `Stream.Blocks` RPC in the v3 API. It extends the
// v2 request by accepting a full `.spkg` package instead of raw module definitions, and
// adds support for parameter overrides and network selection applied server-side.
message Request {
  // If positive, the absolute block number at which to start streaming (inclusive).
  // If 0, streaming starts at the first streamable block of the chain.
  // If negative, the start block is resolved relative to the chain HEAD at the time of
  // the request (e.g., -10 starts 10 blocks before the current HEAD).
  int64 start_block_num = 1;

  // Cursor returned by a previous `BlockScopedData.cursor` or
  // `BlockUndoSignal.last_valid_cursor`. When provided, streaming resumes from the exact
  // position the cursor points to, taking precedence over `start_block_num`. Use this to
  // implement reliable exactly-once resumption after disconnections or forks.
  string start_cursor = 2;

  // If non-zero, streaming stops *before* reaching this block number (exclusive upper bound).
  // If zero, the stream continues indefinitely, following the chain HEAD in real-time.
  uint64 stop_block_num = 3;

  // With final_block_only, you only receive blocks that are irreversible:
  // 'final_block_height' will be equal to current block and no 'undo_signal' will ever be sent
  bool final_blocks_only = 4;

  // Substreams has two mode when executing your module(s) either development mode or production
  // mode. Development and production modes impact the execution of Substreams, important aspects
  // of execution include:
  // * The time required to reach the first byte.
  // * The speed that large ranges get executed.
  // * The module logs and outputs sent back to the client.
  //
  // By default, the engine runs in developer mode, with richer and deeper output. Differences
  // between production and development modes include:
  // * Forward parallel execution is enabled in production mode and disabled in development mode
  // * The time required to reach the first byte in development mode is faster than in production mode.
  //
  // Specific attributes of development mode include:
  // * The client will receive all of the executed module's logs.
  // * It's possible to request specific store snapshots in the execution tree (via `debug_initial_store_snapshot_for_modules`).
  // * Multiple module's output is possible.
  //
  // With production mode`, however, you trade off functionality for high speed enabling forward
  // parallel execution of module ahead of time.
  bool production_mode = 5;

  // Name of the map module whose output should be streamed back to the client. Must be a
  // `map` module defined in the provided `package`. Only one output module is supported per request.
  string output_module = 6;

  // The full .spkg package containing the module definitions and their code.
  sf.substreams.v1.Package package = 7;

  // Module parameter overrides to apply to the package server-side. Keys are module names, values are parameter strings.
  map<string, string> params = 8;

  // Network name to select when the package supports multiple networks (e.g., "mainnet", "sepolia").
  string network = 9;

  // Available only in developer mode
  repeated string debug_initial_store_snapshot_for_modules = 10;

  // When true, prepares the stores and caches on the server without sending any module
  // output. Only progress messages and minimal clock/cursor data are returned. Useful for
  // pre-warming caches (e.g., to reduce latency for a subsequent real request) without
  // incurring the cost of transmitting full block data.
  bool noop_mode = 11;

  // If set, the engine will reject a request if the number of blocks to process (including preparing the stores) is above this limit.
  // Useful as a safeguard for managing costs
  uint64 limit_processed_blocks = 12;

  // Available only in developer mode
  // If set, the server will only send the output of these modules.
  // If unset, all the outputs are sent.
  // This allows the user to reduce the payload in dev mode, while still getting some extra debugging information
  repeated string dev_output_modules = 13;

  // Interval between progress messages, in milliseconds (minimum: 500). When left at 0, the
  // interval widens with the age of the request: 1s for the first minute, 10s up to 5 minutes,
  // 30s up to 10 minutes, 60s beyond that.
  uint64 progress_messages_interval_ms = 14;

  // previously used in partial alpha tests
  reserved 15;

  // If true, blocks close to head will be sent in "partials" as soon as we get them.
  // This means that you will get different versions of the same block number, each an incomplete increment
  // Other blocks will be sent completely (older blocks, or blocks for which the provider did not get a partial in time)
  bool partial_blocks = 16;
}
