syntax = "proto3";

// Compatibility shim: the annotations moved to sf/substreams/sink/v1/schema.proto, same `schema` package and same extension
// numbers. This file only re-exports them so existing `import "sf/substreams/sink/sql/schema/v1/schema.proto"` keep compiling.
// New protos should import the new path.
package schema;

import public "sf/substreams/sink/v1/schema.proto";

option go_package = "github.com/streamingfast/substreams/pb/sf/substreams/sink/sql/schema/v1";
