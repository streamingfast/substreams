syntax = "proto3";

import "sf/substreams/sink/sql/schema/v1/schema.proto";

package test.relations;
option go_package = "test/relations";

// Values for the PostgreSQL sink tests. ClickHouse has no array column for a numeric
// string conversion, so these are kept out of Output, which both sinks share.
message PostgresValuesOutput {
  repeated PostgresValues values = 1;
}

message PostgresValues {
  option (schema.table) = {
    name: "postgres_values"
  };

  uint64 id = 1 [(schema.field) = { primary_key: true }];
  repeated string repeated_str_2_uint256 = 2 [(schema.field) = { convertTo: { uint256{} }}];
  repeated string repeated_str_2_decimal128 = 3 [(schema.field) = { convertTo: { decimal128{ scale: 4 }}}];
  string text = 4;
  repeated string texts = 5;
  PostgresNote note = 6 [(schema.field) = { inline: true }];
  repeated PostgresNote notes = 7 [(schema.field) = { inline: true }];
  oneof choice {
    string choice_text = 8;
    uint64 choice_number = 9;
  }
  string after_choice = 10;
}

message PostgresNote {
  string text = 1;
}
