syntax = "proto3";

package test.clickhouse;

import "sf/substreams/sink/sql/schema/v1/schema.proto";

message Events {
  repeated Event event = 1;
}

// Same shape as test.output.Event, annotated for the ClickHouse sink. It is a
// separate message rather than options on the shared one: the annotations change
// the module hash, and test.output.Event is what the other e2e modules emit.
message Event {
  option (schema.table) = {
    name: "Event"
    clickhouse_table_options: {
      order_by_fields: [{name: "evt_tx_hash"}, {name: "evt_block_number"}]
    }
  };

  // ClickHouse requires the primary key to be a prefix of the sorting key, so
  // the hash leads and the block number follows.
  string evt_tx_hash = 1 [(schema.field) = { primary_key: true }];
  string evt_from = 2;
  string evt_to = 3;
  uint64 evt_block_number = 4;
  uint64 fee = 5;
}
