specVersion: v0.1.0
package:
  name: e2e
  version: v0.2.0

protobuf:
  descriptorSets:
    - module: buf.build/streamingfast/firehose-acme
  files:
    - contract.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: map_events
    kind: map
    initialBlock: 100
    inputs:
      - source: sf.acme.type.v1.Block
    output:
      type: proto:test.output.Events

  - name: map_events_0
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.acme.type.v1.Block
    output:
      type: proto:test.output.Events

  - name: store_stats
    kind: store
    initialBlock: 400
    updatePolicy: add
    valueType: bigint
    inputs:
      - source: sf.acme.type.v1.Block

  - name: store_stats2
    kind: store
    initialBlock: 150
    updatePolicy: add
    valueType: bigint
    inputs:
      - source: sf.acme.type.v1.Block
      - store: store_stats

  - name: map_stats
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.acme.type.v1.Block
      - store: store_stats
    output:
      type: proto:test.output.Events

  - name: map_stats2
    kind: map
    initialBlock: 150
    inputs:
      - source: sf.acme.type.v1.Block
      - store: store_stats2
    output:
      type: proto:test.output.Events

  - name: map_filtered
    kind: map
    initialBlock: 100
    inputs:
      - map: map_events
    output:
      type: proto:test.output.Events

  - name: map_downstream
    kind: map
    initialBlock: 100
    inputs:
      - map: map_filtered
    output:
      type: proto:test.output.Events

network: dummy
