specVersion: v0.1.0
package:
  name: partial-blocks-store
  version: v0.1.0

protobuf:
  descriptorSets:
    - module: buf.build/streamingfast/firehose-acme
  files:
    - contract.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: store_tx_counter
    kind: store
    initialBlock: 100
    updatePolicy: add
    valueType: int64
    inputs:
      - source: sf.acme.type.v1.Block

  - name: map_tx_counter_summary
    kind: map
    initialBlock: 100
    inputs:
      - source: sf.acme.type.v1.Block
      - store: store_tx_counter
    output:
      type: proto:test.output.TxCounterSummary

network: dummy
